<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ww-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="ww-teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ww-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="ww-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ww-bg-grad)" stroke="#14b8a6" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Outer AI Vision / Radar Ring -->
  <circle cx="32" cy="32" r="22" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.35"/>

  <!-- Upper Eco / Clean Flow (Recycling Leaf) -->
  <path d="M19 23C19 16 25 12 33 12C39.5 12 45 16 45 22C45 25 43 27 40 27C37 27 36 25 36 22C36 18.5 33 16 30 16C26 16 23 18.5 23 23C23 25.5 24.5 27 27 28L25 31C21 29 19 26.5 19 23Z" fill="url(#ww-teal-grad)"/>

  <!-- Lower Waste Management Flow -->
  <path d="M45 41C45 48 39 52 31 52C24.5 52 19 48 19 42C19 39 21 37 24 37C27 37 28 39 28 42C28 45.5 31 48 34 48C38 48 41 45.5 41 41C41 38.5 39.5 37 37 36L39 33C43 35 45 37.5 45 41Z" fill="url(#ww-cyan-grad)"/>

  <!-- Center AI Core Sensor / Vision Eye -->
  <circle cx="32" cy="32" r="7" fill="#0f172a" stroke="url(#ww-teal-grad)" stroke-width="2.2" filter="url(#ww-glow)"/>
  <circle cx="32" cy="32" r="3.2" fill="#2dd4bf"/>
  <circle cx="34" cy="30" r="1.2" fill="#ffffff"/>

  <!-- AI Target Reticle Markers -->
  <line x1="32" y1="19" x2="32" y2="22" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="42" x2="32" y2="45" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="32" x2="22" y2="32" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="32" x2="45" y2="32" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round"/>
</svg>